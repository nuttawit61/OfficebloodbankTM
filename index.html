<style>
:root{
  --primary:#00417B;
  --primary-dark:#002B52;
  --primary-light:#E7EFF7;
  --accent:#A4123F;
  --accent-light:#FBEDF1;
  --gold:#C8A951;
  --ink:#1E2733;
  --muted:#5C6B7A;
  --line:#DDE4EC;
  --bg:#F4F6F9;
  --card:#FFFFFF;
  --radius:10px;
  --shadow:0 1px 3px rgba(16,32,56,.08),0 6px 20px rgba(16,32,56,.06);
}
*{box-sizing:border-box}
html{
  /* ค่าพื้นฐาน — จะถูกกำหนดละเอียดอีกครั้งตามขนาดจอในส่วน "สเกลตามขนาดหน้าจอ" ด้านล่าง */
  font-size:calc(clamp(14.5px, 0.39vw + 11px, 20px) * var(--ui-scale, 1));
  -webkit-text-size-adjust:100%;
}
}

html,body{margin:0;padding:0}
body{
  font-family:'Sarabun','Noto Sans Thai','TH Sarabun New',Tahoma,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink); font-size:1rem; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
a{color:var(--primary); text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
.container{max-width:73.75rem;margin:0 auto;padding:0 1.25rem}

/* ---------- Top bar ---------- */
.topbar{background:var(--primary-dark);color:#C9D8E8;font-size:0.8438rem}
.topbar .container{display:flex;justify-content:space-between;align-items:center;gap:1rem;min-height:2.375rem;flex-wrap:wrap}
.topbar .tb-left{display:flex;gap:1.125rem;flex-wrap:wrap}
.topbar span.tb-item{white-space:nowrap}
.topbar a{color:#C9D8E8}
.btn-admin{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;
  padding:3px 0.75rem;border-radius:99px;font-size:0.8125rem;cursor:pointer}
.btn-admin:hover{background:rgba(255,255,255,.22)}
.tb-right{display:flex;align-items:center;gap:0.625rem;flex-wrap:wrap}
.scaler{display:inline-flex;align-items:center;gap:3px;border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:2px 3px}
.scaler b{font-weight:400;color:#9DB4CC;font-size:0.75rem;padding:0 5px}
.scaler button{background:transparent;border:0;color:#C9D8E8;cursor:pointer;border-radius:50%;
  width:1.375rem;height:1.375rem;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center}
.scaler button:hover{background:rgba(255,255,255,.18);color:#fff}
.scaler button.s1{font-size:0.75rem}
.scaler button.s2{font-size:0.875rem}
.scaler button.s3{font-size:1.0625rem}
.scaler button.on{background:var(--gold);color:#3A2E06}

/* ---------- Header ---------- */
header.site{background:#fff;border-bottom:3px solid var(--primary)}
.brand{display:flex;align-items:center;gap:1rem;padding:1rem 0}
.logo{width:4rem;height:4rem;border-radius:50%;background:var(--primary);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:1.375rem;flex:0 0 auto;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
/* โลโก้แบบรูปภาพ: ไม่ครอบวงกลมสีเข้ม เพื่อไม่ให้โลโก้จมหายไปกับพื้นหลัง */
.logo.has-img{width:auto;min-width:0;max-width:13rem;height:4.5rem;border-radius:0;
  padding:0;background:transparent;border:0;box-shadow:none;overflow:visible}
.logo.has-img img{width:auto;max-width:100%;height:100%;object-fit:contain}
.logo.has-img.bg-light{background:#fff;border:1px solid var(--line);border-radius:0.75rem;
  padding:0.25rem 0.5rem;box-shadow:0 1px 2px rgba(16,32,56,.06)}
.logo.has-img.bg-dark{background:var(--primary);border:1px solid rgba(255,255,255,.35);
  border-radius:0.75rem;padding:0.25rem 0.5rem}
.brand h1{margin:0;font-size:1.375rem;font-weight:700;color:var(--primary);line-height:1.3}
.brand .sub{margin:2px 0 0;font-size:0.875rem;color:var(--muted)}
.brand .sub-en{font-size:0.8125rem;color:#8593A3;letter-spacing:.2px}

/* ---------- Nav ---------- */
nav.main{background:var(--primary)}
nav.main .container{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
nav.main a{color:#fff;padding:0.75rem 1.125rem;font-size:0.9688rem;font-weight:500;display:block;border-bottom:3px solid transparent}
nav.main a:hover{background:rgba(255,255,255,.10);text-decoration:none}
nav.main a.active{background:rgba(255,255,255,.14);border-bottom-color:var(--gold)}
.nav-toggle{display:none;background:none;border:0;color:#fff;font-size:1.25rem;padding:0.625rem 0.875rem;cursor:pointer}

/* ---------- Ticker ---------- */
.ticker{background:var(--accent-light);border-bottom:1px solid #F1D9E0}
.ticker .container{display:flex;align-items:center;gap:0.875rem;padding-top:0.5625rem;padding-bottom:0.5625rem}
.ticker .tag{background:var(--accent);color:#fff;font-size:0.7813rem;font-weight:600;padding:2px 0.625rem;border-radius:0.25rem;white-space:nowrap}
.ticker .items{font-size:0.9063rem;color:#7A1030;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ticker .items a{color:#7A1030}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 60%,#001A33 100%);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-5rem;top:-3.75rem;width:21.25rem;height:21.25rem;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(200,169,81,.28),transparent 65%)}
.hero .container{position:relative;z-index:1;padding-top:2.75rem;padding-bottom:2.75rem}
.hero h2{margin:0 0 0.625rem;font-size:1.875rem;font-weight:700;line-height:1.35}
.hero p{margin:0;max-width:47.5rem;color:#CBDCEC;font-size:1.0313rem}
.hero .hero-actions{margin-top:1.25rem;display:flex;gap:0.75rem;flex-wrap:wrap}
.btn{display:inline-block;padding:0.5625rem 1.25rem;border-radius:0.375rem;font-size:0.9375rem;font-weight:500;cursor:pointer;border:1px solid transparent}
.btn-gold{background:var(--gold);color:#3A2E06;border-color:var(--gold)}
.btn-gold:hover{background:#D8BC69;text-decoration:none}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn-ghost:hover{background:rgba(255,255,255,.12);text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:#fff;color:var(--primary);border-color:var(--line)}
.btn-outline:hover{border-color:var(--primary)}
.btn-danger{background:#fff;color:#B3261E;border-color:#F0C9C6}
.btn-danger:hover{background:#FDECEA}
.btn-sm{padding:0.3125rem 0.75rem;font-size:0.8438rem}

/* ---------- Layout ---------- */
main{padding:2.125rem 0 3.125rem}
.grid{display:grid;grid-template-columns:1fr 21.25rem;gap:1.875rem;align-items:start}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:0.75rem;margin-bottom:1.125rem;
  padding-bottom:0.625rem;border-bottom:2px solid var(--line)}
.section-head h3{margin:0;font-size:1.25rem;color:var(--primary);font-weight:700;position:relative;padding-left:0.875rem}
.section-head h3::before{content:"";position:absolute;left:0;top:0.375rem;bottom:0.25rem;width:0.3125rem;background:var(--accent);border-radius:3px}
.section-head .more{font-size:0.875rem}

/* ---------- News cards ---------- */
.news-list{display:flex;flex-direction:column;gap:0.875rem}
.news-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.125rem;
  display:flex;gap:1rem;transition:.15s;cursor:pointer}
.news-item:hover{box-shadow:var(--shadow);border-color:#C3D2E2;transform:translateY(-1px)}
.news-date{flex:0 0 3.875rem;text-align:center;background:var(--primary-light);border-radius:0.5rem;padding:0.5rem 0.25rem;height:fit-content}
.news-date .d{font-size:1.375rem;font-weight:700;color:var(--primary);line-height:1}
.news-date .m{font-size:0.7813rem;color:var(--muted)}
.news-date .y{font-size:0.7188rem;color:#93A2B2}
.news-body h4{margin:0 0 0.375rem;font-size:1.0625rem;font-weight:600;color:var(--ink)}
.news-body p{margin:0;color:var(--muted);font-size:0.9063rem}
.badge{display:inline-block;font-size:0.75rem;padding:1px 0.5625rem;border-radius:99px;background:var(--primary-light);
  color:var(--primary);margin-right:0.375rem;font-weight:500;vertical-align:middle}
.badge.pin{background:var(--accent-light);color:var(--accent)}
.badge.new{background:#E6F6EC;color:#1B7F45}
.thumb{flex:0 0 5.375rem;width:5.375rem;min-width:0;height:7.5rem;border-radius:0.5rem;object-fit:contain;
  background:#F7F9FB;border:1px solid var(--line);padding:0.125rem}
.thumb-ph{flex:0 0 5.375rem;height:7.5rem;border-radius:0.5rem;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--ph-a,#E7EFF7) 0%,var(--ph-b,#CFDDEC) 100%);color:var(--ph-fg,#00417B)}
.thumb-ph::after{content:"";position:absolute;inset:0;border-radius:0.5rem;border:1px solid rgba(255,255,255,.55)}
.thumb-ph svg{width:2.375rem;height:2.375rem;opacity:.9}
.news-item:hover .thumb,.news-item:hover .thumb-ph{filter:brightness(1.04)}

/* ---------- คู่มือบุคลากรใหม่ ---------- */
.guide-intro{background:var(--primary-light);border:1px solid #C9DAEA;border-radius:var(--radius);
  padding:0.875rem 1.125rem;color:var(--primary-dark);margin-bottom:1.125rem;font-size:0.9375rem}
.guide-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:0.75rem;overflow:hidden}
.guide-item summary{list-style:none;cursor:pointer;padding:0.875rem 1.125rem;display:flex;gap:0.875rem;
  align-items:center;font-weight:600;color:var(--ink);font-size:1.0313rem}
.guide-item summary::-webkit-details-marker{display:none}
.guide-item summary:hover{background:#F7FAFD}
.guide-num{flex:0 0 2rem;height:2rem;border-radius:50%;background:var(--primary-light);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:0.9063rem;font-weight:700}
.guide-item summary .arw{margin-left:auto;color:var(--muted);font-size:0.75rem;transition:transform .15s}
.guide-item[open]{border-color:#C3D2E2;box-shadow:var(--shadow)}
.guide-item[open] summary{background:var(--primary-light);color:var(--primary)}
.guide-item[open] summary .arw{transform:rotate(180deg)}
.guide-body{padding:0.875rem 1.125rem 1.125rem 4rem}
.guide-body p{margin:0 0 0.75rem;line-height:1.8}
.guide-body p:last-child{margin-bottom:0}
.guide-links{margin-top:0.875rem;display:flex;flex-wrap:wrap;gap:0.5rem}
.guide-links a{font-size:0.875rem;border:1px solid var(--line);border-radius:99px;padding:0.25rem 0.8125rem;background:#fff}
.guide-links a:hover{border-color:var(--primary);text-decoration:none;background:var(--primary-light)}


/* ---------- วิดีโอ ---------- */
.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem;align-items:start}
.video-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  box-shadow:0 1px 3px rgba(16,32,56,.06)}
.vd-frame{position:relative;aspect-ratio:16/9;background:#0B1B2B;cursor:pointer;overflow:hidden}
.vd-frame.vertical{aspect-ratio:9/16}
.vd-frame .vd-thumb{width:100%;height:100%;object-fit:cover;display:block;border:0}
.vd-tt{display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#12283F 0%,#001C36 100%)}
.vd-yt{background:linear-gradient(135deg,#2A1218 0%,#3A0C12 100%)}
.vd-tt span{color:#fff;font-weight:700;letter-spacing:1.5px;opacity:.75;font-size:0.9375rem}
.vd-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:background .2s}
.vd-play svg{width:3.5rem;height:3.5rem;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));transition:transform .2s}
.vd-frame:hover .vd-play{background:rgba(0,20,40,.22)}
.vd-frame:hover .vd-play svg{transform:scale(1.09)}
.vd-frame iframe{width:100%;height:100%;border:0;display:block}
.vd-frame.playing{cursor:default}
.vd-meta{padding:0.75rem 0.9375rem 0.875rem}
.vd-title{font-weight:600;font-size:0.9688rem;line-height:1.5;color:var(--ink)}
.vd-note{font-size:0.8438rem;color:var(--muted);margin-top:0.25rem;line-height:1.55}

/* ---------- Sidebar ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:1.375rem}
.card > h4{margin:0;padding:0.75rem 1rem;background:var(--primary);color:#fff;font-size:0.9688rem;font-weight:600}
.card .card-body{padding:0.875rem 1rem}
.mini-event{display:flex;gap:0.75rem;padding:0.625rem 0;border-bottom:1px dashed var(--line)}
.mini-event:last-child{border-bottom:0;padding-bottom:0}
.mini-event .md{flex:0 0 3rem;text-align:center;background:var(--accent);color:#fff;border-radius:0.375rem;padding:0.3125rem 2px;height:fit-content}
.mini-event .md .d{font-size:1.0625rem;font-weight:700;line-height:1.1}
.mini-event .md .m{font-size:0.6875rem}
.mini-event .t{font-size:0.9063rem;font-weight:500}
.mini-event .s{font-size:0.8125rem;color:var(--muted)}
.mini-order{display:block;padding:0.625rem 0;border-bottom:1px dashed var(--line);color:var(--ink)}
.mini-order:last-child{border-bottom:0;padding-bottom:0}
.mini-order:hover{text-decoration:none;color:var(--primary)}
.mini-order .t{font-size:0.9063rem;font-weight:500;line-height:1.5}
.mini-order .s{font-size:0.8125rem;color:var(--muted);margin-top:2px}
.mini-order .s .dot{color:var(--line-2,#CFDAE6);margin:0 0.25rem}
.link-list{list-style:none;margin:0;padding:0}
.link-list li{border-bottom:1px dashed var(--line)}
.link-list li:last-child{border-bottom:0}
.link-list a{display:block;padding:0.5625rem 0 0.5625rem 1.125rem;position:relative;font-size:0.9063rem;color:var(--ink)}
.link-list a::before{content:"▸";position:absolute;left:0;color:var(--accent)}
.link-list a:hover{color:var(--primary);text-decoration:none}

/* ---------- Filters ---------- */
.filters{display:flex;gap:0.625rem;flex-wrap:wrap;margin-bottom:1.125rem;align-items:center}
.filter-row{display:flex;gap:0.625rem;flex-wrap:wrap;align-items:center;margin-bottom:0.75rem}
.filter-label{font-size:0.8125rem;color:var(--muted);font-weight:600;flex:0 0 auto;min-width:3.25rem}
.doc-level{font-size:0.8125rem;color:var(--muted);margin-top:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:0.3125rem 0.9375rem;font-size:0.875rem;cursor:pointer;color:var(--muted)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.search-box{margin-left:auto;position:relative}
.search-box input{border:1px solid var(--line);border-radius:99px;padding:0.4375rem 1rem;font-size:0.9063rem;width:14.375rem;font-family:inherit}
.search-box input:focus{outline:2px solid var(--primary-light);border-color:var(--primary)}

/* ---------- Article ---------- */
.article{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:1.75rem 2rem}
.article h2{margin:0.375rem 0 0.625rem;font-size:1.625rem;color:var(--primary);line-height:1.4}
.article .meta{color:var(--muted);font-size:0.875rem;border-bottom:1px solid var(--line);padding-bottom:0.875rem;margin-bottom:1.125rem}
.article .content{font-size:1.0313rem}
.article .content p{margin:0 0 0.875rem}
.article img.cover{width:100%;border-radius:0.5rem;margin-bottom:1.125rem}
.attach{margin-top:1.375rem;border-top:1px solid var(--line);padding-top:1rem}
.attach a{display:inline-flex;align-items:center;gap:0.5rem;background:var(--primary-light);padding:0.5rem 0.875rem;
  border-radius:0.375rem;margin:0 0.5rem 0.5rem 0;font-size:0.9063rem}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.875rem}
.cal-head h3{margin:0;font-size:1.1875rem;color:var(--primary)}
.cal{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal th{background:var(--primary);color:#fff;font-weight:500;font-size:0.875rem;padding:0.5625rem 0.25rem}
.cal td{border:1px solid var(--line);vertical-align:top;height:6rem;width:14.28%;padding:0.375rem;font-size:0.8438rem}
.cal td.out{background:#FAFBFC;color:#B9C4D0}
.cal td.today{background:#FFFBEA}
.cal .dnum{font-weight:600;color:var(--muted);font-size:0.8125rem}
.cal td.today .dnum{background:var(--accent);color:#fff;border-radius:50%;width:1.375rem;height:1.375rem;display:inline-flex;align-items:center;justify-content:center}
.cal .ev{display:block;background:var(--primary-light);color:var(--primary);border-left:3px solid var(--primary);
  border-radius:3px;padding:2px 0.3125rem;margin-top:3px;font-size:0.7813rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.cal .ev.a{background:var(--accent-light);color:var(--accent);border-left-color:var(--accent)}

/* ---------- Documents ---------- */
.doc-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.doc-table th{background:var(--primary-light);color:var(--primary);text-align:left;font-size:0.9063rem;padding:0.6875rem 0.875rem;font-weight:600}
.doc-table td{border-top:1px solid var(--line);padding:0.6875rem 0.875rem;font-size:0.9375rem;vertical-align:top}
.doc-table tr:hover td{background:#FAFCFE}
.doc-title{font-weight:500}
.doc-note{font-size:0.8438rem;color:var(--muted)}
.doc-no{font-weight:600;color:var(--primary);white-space:nowrap;font-size:0.9063rem}
.usebar{height:0.625rem;background:var(--line);border-radius:99px;overflow:hidden;margin:0.5rem 0 0.375rem}
.usebar i{display:block;height:100%;border-radius:99px;background:#1B7F45;transition:width .3s}
.usebar.warn i{background:#C8891A}
.usebar.full i{background:#B3261E}
.use-note{font-size:0.8438rem;color:var(--muted);line-height:1.6}

/* ---------- Footer ---------- */
footer.site{background:var(--primary-dark);color:#B9CBDD;margin-top:auto;padding:2.125rem 0 1.375rem;font-size:0.9063rem}
footer.site .fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:1.875rem}
footer.site h5{color:#fff;font-size:1rem;margin:0 0 0.625rem;font-weight:600}
footer.site a{color:#B9CBDD}
footer.site .copy{border-top:1px solid rgba(255,255,255,.14);margin-top:1.5rem;padding-top:0.875rem;font-size:0.8438rem;color:#8FA6BC;
  display:flex;justify-content:space-between;gap:0.75rem;flex-wrap:wrap}

/* ---------- Admin ---------- */
.admin-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.admin-top{background:var(--primary-dark);color:#fff;padding:0.875rem 1.375rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.625rem}
.admin-top h3{margin:0;font-size:1.125rem}
.admin-tabs{display:flex;gap:2px;background:var(--primary);flex-wrap:wrap}
.admin-tabs button{background:transparent;border:0;color:#CBDCEC;padding:0.6875rem 1.125rem;font-size:0.9063rem;cursor:pointer;border-bottom:3px solid transparent}
.admin-tabs button.active{color:#fff;background:rgba(255,255,255,.13);border-bottom-color:var(--gold)}
.admin-body{padding:1.375rem}
.form-row{margin-bottom:0.875rem}
.form-row label{display:block;font-size:0.875rem;font-weight:600;color:var(--muted);margin-bottom:0.3125rem}
.form-row input[type=text],.form-row input[type=date],.form-row input[type=time],.form-row input[type=password],
.form-row input[type=url],.form-row select,.form-row textarea{
  width:100%;border:1px solid var(--line);border-radius:0.375rem;padding:0.5625rem 0.75rem;font-size:0.9375rem;font-family:inherit;background:#fff;color:var(--ink)}
.form-row textarea{min-height:10.625rem;resize:vertical;line-height:1.7}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{outline:2px solid var(--primary-light);border-color:var(--primary)}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:0.875rem}
.form-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.875rem}
.hint{font-size:0.8125rem;color:var(--muted);margin-top:0.25rem}
.admin-list{width:100%;border-collapse:collapse}
.admin-list th{text-align:left;font-size:0.8438rem;color:var(--muted);border-bottom:2px solid var(--line);padding:0.5rem 0.625rem}
.admin-list td{border-bottom:1px solid var(--line);padding:0.5625rem 0.625rem;font-size:0.9063rem;vertical-align:middle}
.admin-list .acts{white-space:nowrap;text-align:right}
.toolbar{display:flex;gap:0.625rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.notice{background:#FFF8E5;border:1px solid #F0DFAE;color:#6B5312;padding:0.75rem 1rem;border-radius:0.5rem;font-size:0.9063rem;margin-bottom:1.125rem}
.notice.info{background:var(--primary-light);border-color:#C4D8EC;color:#0B3D6B}
.notice.ok{background:#E9F7EF;border-color:#BDE5CB;color:#14683A}
.switch{display:inline-flex;align-items:center;gap:0.5rem;font-size:0.9063rem;color:var(--ink);cursor:pointer}
.login-box{max-width:23.75rem;margin:3.75rem auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:1.75rem}
.login-box h3{margin:0 0 0.375rem;color:var(--primary);font-size:1.25rem;text-align:center}
.login-box p{margin:0 0 1.125rem;text-align:center;color:var(--muted);font-size:0.875rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:1.75rem;background:var(--ink);color:#fff;
  padding:0.6875rem 1.375rem;border-radius:99px;font-size:0.9375rem;z-index:999;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--muted);padding:2.5rem 0.625rem;background:#fff;border:1px dashed var(--line);border-radius:var(--radius)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(12,22,36,.55);display:flex;align-items:center;justify-content:center;z-index:900;padding:1.25rem}
.modal{background:#fff;border-radius:0.75rem;max-width:38.75rem;width:100%;max-height:86vh;overflow:auto;padding:1.625rem 1.75rem}
.modal h3{margin:0 0 0.625rem;color:var(--primary);font-size:1.25rem}

@media (max-width:960px){
  .grid{grid-template-columns:1fr}
  footer.site .fgrid{grid-template-columns:1fr}
}
@media (max-width:680px){
  .brand{gap:0.75rem}
  .brand h1{font-size:1.125rem}
  .logo{width:3.25rem;height:3.25rem;font-size:1.125rem}
  .logo.has-img{min-width:0;max-width:8rem;height:3.5rem;padding:0}
  .logo.has-img.bg-light,.logo.has-img.bg-dark{padding:0.1875rem 0.375rem}
  .hero h2{font-size:1.4375rem}
  .form-2,.form-3{grid-template-columns:1fr}
  nav.main .container{position:relative}
  nav.main a{padding:0.625rem 0.75rem;font-size:0.9063rem}
  .news-item{gap:0.625rem;padding:0.875rem}
  .news-date{flex:0 0 3rem;padding:0.375rem 0.125rem}
  .news-date .d{font-size:1.1875rem}
  .thumb,.thumb-ph{flex:0 0 3.625rem;width:3.625rem;min-width:0;height:5rem;border-radius:0.4375rem}
  .thumb-ph svg{width:1.5rem;height:1.5rem}
  .cal td{height:4.375rem;font-size:0.75rem}
  .col-hide-sm{display:none}
  .guide-body{padding-left:1.125rem}
  .doc-table th,.doc-table td{padding:0.5625rem 0.5rem;font-size:0.875rem}
  .search-box{margin-left:0;width:100%}
  .search-box input{width:100%}
  .topbar .tb-left span.tb-item:nth-child(n+3){display:none}
  .scaler b{display:none}
}
@media print{
  .topbar,nav.main,.ticker,footer.site,.filters,.btn,.hero .hero-actions{display:none!important}
}

/* ==========================================================================
   ปรับผิวเว็บไซต์ให้ดูทันสมัย (Modern refresh) — ส่วนนี้เขียนทับสไตล์ด้านบน
   ========================================================================== */
:root{
  --primary:#00417B; --primary-dark:#002647; --primary-light:#EAF1F8;
  --accent:#9E1039; --accent-light:#FBEEF2;
  --gold:#C8A951; --gold-soft:#EFE3C2;
  --ink:#131B25; --muted:#64717F;
  --line:#E4EAF1; --line-2:#CFDAE6;
  --bg:#F7F9FC; --card:#FFFFFF;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(12,26,45,.05),0 10px 26px -12px rgba(12,26,45,.16);
  --shadow-lg:0 2px 6px rgba(12,26,45,.06),0 26px 56px -22px rgba(12,26,45,.28);
}
body{line-height:1.7;letter-spacing:.1px}
.container{max-width:76rem}
a{transition:color .16s}

/* --- แถบบนสุด --- */
.topbar{background:#00203D;color:#A8C0D8;font-size:0.8125rem}
.topbar .container{min-height:2.5rem}
.topbar a{color:#A8C0D8}
.scaler{border-color:rgba(255,255,255,.16)}

/* --- ส่วนหัว --- */
header.site{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(12,26,45,.02)}
.brand{padding:1.375rem 0;gap:1.125rem}
.brand h1{font-size:1.4375rem;letter-spacing:-.2px;line-height:1.25}
.brand .sub{margin-top:4px;font-size:0.875rem}
.brand .sub-en{font-size:0.8125rem;letter-spacing:.4px;text-transform:none}

/* --- เมนูหลัก --- */
nav.main{background:var(--primary);box-shadow:inset 0 -1px 0 rgba(255,255,255,.10)}
nav.main .container{gap:0.125rem}
nav.main a{padding:0.875rem 1.125rem;font-size:0.9375rem;font-weight:500;letter-spacing:.1px;
  border-bottom:2px solid transparent;border-radius:0;transition:background .16s,border-color .16s}
nav.main a:hover{background:rgba(255,255,255,.08)}
nav.main a.active{background:rgba(255,255,255,.10);border-bottom-color:var(--gold);font-weight:600}

/* --- แถบประกาศสำคัญ --- */
.ticker{background:#FCF3F6;border-bottom:1px solid #F0DCE3}
.ticker .tag{border-radius:99px;padding:2px 0.6875rem;letter-spacing:.2px;font-weight:600}

/* --- Hero --- */
.hero{background:linear-gradient(155deg,#00447F 0%,#002E58 55%,#001C36 100%)}
.hero::after{right:-8rem;top:-8rem;width:34rem;height:34rem;
  background:radial-gradient(circle at 32% 34%,rgba(200,169,81,.22),transparent 62%)}
.hero::before{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:3.5rem 3.5rem}
.hero .container{padding-top:3.5rem;padding-bottom:5.75rem}
.hero h2{font-size:2.25rem;letter-spacing:-.5px;line-height:1.3;font-weight:700}
.hero p{color:#C2D5E7;font-size:1.0625rem;line-height:1.75}
.hero .hero-actions{margin-top:1.75rem;gap:0.875rem}
.hero-grid{display:grid;grid-template-columns:1fr 20rem;gap:2.5rem;align-items:center}
.hero-eyebrow{display:inline-flex;align-items:center;gap:0.5rem;font-size:0.8125rem;font-weight:600;
  letter-spacing:1.4px;color:var(--gold-soft);margin-bottom:0.875rem}
.hero-eyebrow::before{content:"";width:1.75rem;height:2px;background:var(--gold);border-radius:2px}
.hero-next{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  border-radius:var(--radius);padding:1.25rem;backdrop-filter:blur(4px)}
.hero-next .hn-label{font-size:0.75rem;letter-spacing:1.2px;font-weight:600;color:var(--gold-soft);margin-bottom:0.875rem}
.hero-next .hn-date{display:flex;align-items:baseline;gap:0.4375rem;color:#fff;margin-bottom:0.5rem}
.hero-next .hn-date b{font-size:2rem;font-weight:700;line-height:1;letter-spacing:-1px}
.hero-next .hn-date span{font-size:0.9375rem;color:#C2D5E7}
.hero-next .hn-title{color:#fff;font-weight:600;font-size:0.9688rem;line-height:1.5}
.hero-next .hn-meta{color:#A8C0D8;font-size:0.8438rem;margin-top:0.375rem}

/* --- ปุ่ม --- */
.btn{border-radius:0.5rem;padding:0.625rem 1.375rem;font-weight:600;letter-spacing:.1px;
  transition:background .16s,border-color .16s,box-shadow .16s,transform .16s}
.btn:hover{text-decoration:none}
.btn-gold{box-shadow:0 6px 18px -8px rgba(200,169,81,.7)}
.btn-gold:hover{transform:translateY(-1px)}
.btn-primary:hover{box-shadow:0 8px 20px -10px rgba(0,65,123,.7)}
.btn-outline{border-color:var(--line-2)}
.btn-outline:hover{border-color:var(--primary);background:var(--primary-light)}
.btn-sm{padding:0.375rem 0.8125rem;font-size:0.8438rem;font-weight:500}

/* --- ทางลัด (หน้าแรก) --- */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13.5rem,1fr));gap:1rem;margin:-3.25rem 0 2.5rem;position:relative;z-index:2}
.quick-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:1.25rem 1.25rem 1.125rem;box-shadow:var(--shadow);display:block;color:var(--ink);
  transition:transform .18s,box-shadow .18s,border-color .18s}
.quick-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line-2);text-decoration:none}
.quick-ico{width:2.625rem;height:2.625rem;border-radius:0.75rem;background:var(--primary-light);color:var(--primary);
  display:flex;align-items:center;justify-content:center;margin-bottom:0.875rem}
.quick-ico svg{width:1.375rem;height:1.375rem}
.quick-card h4{margin:0 0 0.25rem;font-size:1rem;font-weight:600;color:var(--primary)}
.quick-card p{margin:0;font-size:0.8438rem;color:var(--muted);line-height:1.6}
.quick-card h4{display:flex;align-items:center;gap:0.375rem}

/* --- หัวข้อส่วน --- */
.section-head{align-items:baseline;margin-bottom:1.125rem;padding-bottom:0.75rem;border-bottom:1px solid var(--line)}
.section-head h3{font-size:1.3125rem;letter-spacing:-.3px;padding-left:0}
.section-head h3::before{display:none}
.section-head .more{font-weight:600;font-size:0.875rem}

/* --- การ์ดข่าว --- */
.news-item{border-radius:var(--radius);padding:1.125rem;gap:1.125rem;
  transition:box-shadow .18s,border-color .18s,transform .18s}
.news-item:hover{box-shadow:var(--shadow-lg);border-color:var(--line-2);transform:translateY(-2px)}
.news-date{background:var(--primary-light);border-radius:0.625rem;flex:0 0 3.75rem}
.news-body h4{font-size:1.0625rem;line-height:1.5;margin-top:0.375rem;letter-spacing:-.1px}
.news-body p{line-height:1.65}
.thumb,.thumb-ph{border-radius:0.625rem}
.badge{border-radius:0.375rem;font-weight:600;letter-spacing:.2px;padding:2px 0.5rem}

/* --- การ์ดแถบข้าง --- */
.card{border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:1.25rem}
.card > h4{background:#fff;color:var(--primary);border-bottom:1px solid var(--line);
  padding:0.9375rem 1.125rem;font-size:0.9375rem;letter-spacing:-.1px;display:flex;align-items:center;gap:0.5rem}
.card > h4::before{content:"";width:0.1875rem;height:1rem;background:var(--gold);border-radius:2px}
.card .card-body{padding:1rem 1.125rem}
.mini-event .md{border-radius:0.5rem;background:var(--accent-light);color:var(--accent)}
.mini-event .md .d{font-weight:700}
.link-list a::before{content:"";position:absolute;left:0;top:1.125rem;width:0.3125rem;height:0.3125rem;
  border-radius:50%;background:var(--gold)}

/* --- ตัวกรอง / ค้นหา --- */
.chip{border-radius:99px;padding:0.375rem 1rem;transition:.16s;font-weight:500}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip.active{box-shadow:0 6px 16px -8px rgba(0,65,123,.8)}
.search-box input{padding:0.5rem 1.0625rem}

/* --- ตาราง --- */
.doc-table{border-radius:var(--radius);box-shadow:var(--shadow)}
.doc-table th{background:#F4F7FB;color:var(--primary);border-bottom:1px solid var(--line);
  font-size:0.8438rem;letter-spacing:.3px;text-transform:none;padding:0.8125rem 1rem}
.doc-table td{padding:0.875rem 1rem}
.doc-table tr:hover td{background:#F9FBFD}

/* --- บทความ / คู่มือ --- */
.article{border-radius:var(--radius);padding:2.25rem 2.5rem;box-shadow:var(--shadow)}
.article h2{letter-spacing:-.4px}
.guide-item{border-radius:var(--radius)}
.guide-item[open]{box-shadow:var(--shadow)}
.guide-intro{border-radius:var(--radius)}

/* --- ท้ายเว็บ --- */
footer.site{background:#00203D}

@media (max-width:960px){
  .hero-grid{grid-template-columns:1fr;gap:1.75rem}
  .quick-grid{margin-top:1.5rem}
}
@media (max-width:680px){
  .hero .container{padding-top:2.5rem;padding-bottom:2.5rem}
  .hero h2{font-size:1.625rem}
  .quick-grid{grid-template-columns:1fr 1fr;gap:0.75rem;margin-top:1.25rem}
  .quick-card{padding:1rem}
  .quick-card p{display:none}
  .article{padding:1.375rem 1.25rem}
}
.hero + main{padding-top:0}

/* ---------- ลูกเล่น: การเคลื่อนไหวอย่างนุ่มนวล ---------- */
html{scroll-behavior:smooth}
.thumb,.thumb-ph{transition:transform .28s cubic-bezier(.22,.61,.36,1),filter .2s ease}
.news-item:hover .thumb,.news-item:hover .thumb-ph{transform:scale(1.045)}
.quick-ico{transition:transform .22s cubic-bezier(.22,.61,.36,1),background .22s ease,color .22s ease}
.quick-card:hover .quick-ico{transform:translateY(-2px);background:var(--primary);color:#fff}
.guide-item summary .arw{transition:transform .25s cubic-bezier(.22,.61,.36,1)}
.link-list a,.chip,.badge{transition:color .16s,background .16s,border-color .16s}
@media (prefers-reduced-motion: no-preference){
  .page-in{animation:pageIn .3s cubic-bezier(.22,.61,.36,1) both}
  @keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .rv{opacity:0;transform:translateY(16px);
    transition:opacity .55s cubic-bezier(.22,.61,.36,1),transform .55s cubic-bezier(.22,.61,.36,1)}
  .rv.rv-in{opacity:1;transform:none}
}
@media print{ .rv,.page-in{opacity:1!important;transform:none!important;animation:none!important} }
/* ==========================================================================
   สเกลตามขนาดหน้าจอ — โทรศัพท์ / แท็บเล็ต / คอมพิวเตอร์ ใช้สูตรคนละชุด
   ตัวเลขฐานนี้คูณกับ --ui-scale จากปุ่ม "ขนาดตัวอักษร" บนแถบด้านบนอีกที
   ========================================================================== */
/* คอมพิวเตอร์ (กว้าง 1024px ขึ้นไป): 16px → 20px ตามความกว้างจอ */
@media (min-width:1024px){
  html{ font-size:calc(clamp(16px, 0.39vw + 11px, 20px) * var(--ui-scale, 1)); }
}
/* แท็บเล็ต (601 - 1023px): 15px → 17px */
@media (min-width:601px) and (max-width:1023.98px){
  html{ font-size:calc(clamp(15px, 0.55vw + 11.4px, 17px) * var(--ui-scale, 1)); }
}
/* โทรศัพท์ (ไม่เกิน 600px): ไล่ตามความกว้างเครื่องจริง ~14.8px บนจอเล็ก ถึง ~17px บนจอใหญ่ */
@media (max-width:600px){
  html{ font-size:calc(clamp(14.5px, 1.05vw + 11.4px, 17px) * var(--ui-scale, 1)); }
  .container{ padding:0 0.875rem; }
  main{ padding:1.5rem 0 2.25rem; }
  .hero .container{ padding-top:2.25rem; padding-bottom:2.25rem; }
  .article{ padding:1.25rem 1.125rem; }
  .card .card-body{ padding:0.875rem 1rem; }
  /* ปุ่มและลิงก์ให้กดง่ายด้วยนิ้ว */
  .btn{ padding:0.6875rem 1.125rem; }
  .btn-sm{ padding:0.5rem 0.875rem; }
  .chip{ padding:0.4375rem 0.9375rem; }
}
@media (max-width:360px){
  .container{ padding:0 0.75rem; }
  .brand h1{ font-size:1.0625rem; }
}
/* เมนูหลักบนมือถือ: เลื่อนแนวนอนแถวเดียว แทนการตัดขึ้นบรรทัดใหม่ 3 แถว */
nav.main{ position:relative; }
@media (max-width:900px){
  nav.main .container{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;
    -webkit-overflow-scrolling:touch; }
  nav.main .container::-webkit-scrollbar{ display:none; }
  nav.main a{ flex:0 0 auto; white-space:nowrap; padding:0.75rem 0.875rem; }
  nav.main::after{ content:""; position:absolute; right:0; top:0; bottom:0; width:2.25rem; pointer-events:none;
    background:linear-gradient(90deg, rgba(0,65,123,0), var(--primary)); }
</style>

/* ---------- utilities ---------- */
function $(sel,root){return (root||document).querySelector(sel);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(p){return (p||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function parseDate(s){ if(!s) return null; var p=String(s).split("-"); if(p.length<3) return null;
  var d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d.getTime())?null:d; }
function thDate(s,full){ var d=parseDate(s); if(!d) return "-";
  return d.getDate()+" "+(full?TH_MONTH[d.getMonth()]:TH_MONTH_S[d.getMonth()])+" "+(d.getFullYear()+543); }
function thDateLong(s){ var d=parseDate(s); if(!d) return "-";
  return "วัน"+["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"][d.getDay()]+"ที่ "+d.getDate()+" "+TH_MONTH[d.getMonth()]+" พ.ศ. "+(d.getFullYear()+543); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function isNew(s){ var d=parseDate(s); if(!d) return false; return (Date.now()-d.getTime())/86400000 <= 14; }
function nl2p(t){ return String(t||"").split(/\n\s*\n/).map(function(p){
  return "<p>"+esc(p).replace(/\n/g,"<br>").replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')+"</p>"; }).join(""); }
function toast(msg){ var t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){t.remove();},2200); }

/* ---------- data ---------- */
function loadData(){
  try{ EMBEDDED = JSON.parse($("#site-data").textContent); }catch(e){ EMBEDDED = {}; }
  var raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){}
  if(raw){ try{ DATA = JSON.parse(raw); }catch(e){ DATA = null; } }
  if(!DATA) DATA = JSON.parse(JSON.stringify(EMBEDDED));
  normalize();
}
function logoBgClass(v){ return v==="light" ? "bg-light" : (v==="dark" ? "bg-dark" : "bg-none"); }
function normalize(){
  DATA.settings = DATA.settings || {};
  DATA.settings.logoBg = DATA.settings.logoBg || "none";
  DATA.settings.contact = DATA.settings.contact || {};
  DATA.settings.quickLinks = DATA.settings.quickLinks || [];
  DATA.news = DATA.news || []; DATA.events = DATA.events || []; DATA.docs = DATA.docs || [];
  DATA.orders = DATA.orders || []; DATA.guide = DATA.guide || []; DATA.videos = DATA.videos || [];
  if(typeof DATA.settings.guideIntro !== "string") DATA.settings.guideIntro = "";
  DATA.settings.showAdminBtn = DATA.settings.showAdminBtn === true;
  DATA.newsCats = DATA.newsCats || []; DATA.docCats = DATA.docCats || [];
  DATA.orderCats = (DATA.orderCats && DATA.orderCats.length) ? DATA.orderCats
    : ["คำสั่ง","ประกาศ","ระเบียบ/แนวปฏิบัติ","หนังสือเวียน"];
  DATA.orderLevels = (DATA.orderLevels && DATA.orderLevels.length) ? DATA.orderLevels
    : ["มหาวิทยาลัย","คณะแพทยศาสตร์ศิริราชพยาบาล","ภาควิชาเวชศาสตร์การธนาคารเลือด","อื่นๆ"];
}
var STORE_LIMIT = 5000000;   /* โควตา localStorage โดยประมาณ (ตัวอักษร) */
var STORE_WARNED = false;
function storeSize(){ try{ return (localStorage.getItem(STORE_KEY)||"").length; }catch(e){ return 0; } }
function saveData(){
  var json;
  try{ json = JSON.stringify(DATA); }
  catch(e){ alert("เตรียมข้อมูลเพื่อบันทึกไม่สำเร็จ"); return false; }
  try{
    localStorage.setItem(STORE_KEY, json);
    if(!STORE_WARNED && json.length > STORE_LIMIT*0.7){
      STORE_WARNED = true;
      alert("เตือนล่วงหน้า: พื้นที่จัดเก็บในเบราว์เซอร์ใช้ไปแล้วประมาณ "+Math.round(json.length/1024)+" KB "+
        "จากที่มีราว "+Math.round(STORE_LIMIT/1024)+" KB\n\n"+
        "แนะนำให้ไปที่แท็บ “บันทึก & เผยแพร่” แล้วกด “สร้างไฟล์เว็บฉบับใหม่” เพื่อบันทึกงานลงไฟล์ก่อน\n"+
        "จากนั้นลดขนาดข้อมูล เช่น ลบรูปที่ไม่จำเป็น หรือเปลี่ยนไฟล์แนบเป็นลิงก์ Google Drive");
    }
    return true;
  }catch(e){
    alert("บันทึกลงเบราว์เซอร์ไม่สำเร็จ เพราะพื้นที่จัดเก็บเต็มแล้ว\n\n"+
      "ข้อมูลที่เพิ่งแก้ยังอยู่บนหน้าจอ ยังไม่หายไปไหน กรุณาทำตามนี้ทันที\n"+
      "1) ไปที่แท็บ “บันทึก & เผยแพร่”\n"+
      "2) กด “สร้างไฟล์เว็บฉบับใหม่ (index.html)” เพื่อบันทึกงานทั้งหมดลงไฟล์\n"+
      "3) นำไฟล์ที่ได้ไปวางทับไฟล์เดิม แล้วกด “ล้างการแก้ไขในเครื่องนี้”\n\n"+
      "อย่าเพิ่งปิดแท็บนี้ก่อนทำข้อ 2 มิฉะนั้นงานที่แก้ล่าสุดจะหาย");
    return false;
  }
}
function sizeOf(x){ try{ return JSON.stringify(x||"").length; }catch(e){ return 0; } }
function dataBreakdown(){
  var b={img:0, att:0, logo:sizeOf(DATA.settings.logoUrl)};
  (DATA.news||[]).forEach(function(n){
    b.img += sizeOf(n.image);
    (n.attachments||[]).forEach(function(a){ if(String(a.url||"").indexOf("data:")===0) b.att += sizeOf(a.url); });
  });
  (DATA.orders||[]).forEach(function(o){ if(String(o.url||"").indexOf("data:")===0) b.att += sizeOf(o.url); });
  (DATA.docs||[]).forEach(function(d){ if(String(d.url||"").indexOf("data:")===0) b.att += sizeOf(d.url); });
  return b;
}
function applyTheme(){
  var s = DATA.settings;
  document.documentElement.style.setProperty("--primary", s.primaryColor||"#00417B");
  document.documentElement.style.setProperty("--accent", s.accentColor||"#A4123F");
  document.documentElement.style.setProperty("--primary-dark", shade(s.primaryColor||"#00417B",-28));
  document.documentElement.style.setProperty("--primary-light", tint(s.primaryColor||"#00417B",88));
  document.documentElement.style.setProperty("--accent-light", tint(s.accentColor||"#A4123F",92));
  document.title = (s.orgName||"เว็บไซต์ภาควิชา");
}
function hex2rgb(h){ h=String(h||"").replace("#",""); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n=parseInt(h||"00417B",16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function shade(h,p){ var c=hex2rgb(h); return "#"+c.map(function(v){ v=Math.max(0,Math.min(255,Math.round(v+ (p/100)*255)));
  return v.toString(16).padStart(2,"0"); }).join(""); }
function tint(h,p){ var c=hex2rgb(h); return "#"+c.map(function(v){ v=Math.round(v+(255-v)*(p/100));
  return v.toString(16).padStart(2,"0"); }).join(""); }

/* ---------- routing ---------- */
function readHash(){
  var h = (location.hash||"#/").replace(/^#/,"");
  var parts = h.split("/").filter(Boolean);
  view.name = parts[0] || "home";
  view.id = parts[1] || null;
  if(["home","news","orders","article","calendar","docs","guide","contact","admin"].indexOf(view.name)<0) view.name="home";
}
window.addEventListener("hashchange", function(){ readHash(); render(); window.scrollTo(0,0); });
/* ทางลัดสำหรับผู้ดูแล: Ctrl + Alt + A */
window.addEventListener("keydown", function(e){
  if(e.ctrlKey && e.altKey && (e.key==="a" || e.key==="A" || e.code==="KeyA")){ e.preventDefault(); go("#/admin"); }
});
function go(h){ location.hash = h; }

function tickerHTML(){
  var s = DATA.settings;
  if(s.urgent && s.urgent.trim()){

           '<div class="items">'+esc(s.urgent)+'</div></div></div>';
  }
  var pin = published().filter(function(n){return n.pinned;})
      .map(function(n){ return {t:n.title, h:"#/article/"+n.id}; })
    .concat(publishedOrders().filter(function(o){return o.pinned;})
      .map(function(o){ return {t:o.title, h:"#/orders"}; }));
  if(!pin.length) return "";
  return '<div class="ticker"><div class="container"><span class="tag">ประกาศสำคัญ</span><div class="items">'+
    pin.slice(0,3).map(function(p){ return '<a href="'+esc(p.h)+'">'+esc(p.t)+'</a>'; }).join(" &nbsp;•&nbsp; ")+
    '</div></div></div>';
}

function published(){
  return DATA.news.filter(function(n){return n.published!==false;})
    .sort(function(a,b){ if(!!b.pinned - !!a.pinned) return (b.pinned?1:0)-(a.pinned?1:0);
      return String(b.date).localeCompare(String(a.date)); });
}
function upcoming(limit){
  var t = todayISO();
  return DATA.events.filter(function(e){ return String(e.end||e.date) >= t; })
    .sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); }).slice(0, limit||5);
}

  "ประกาศภาควิชา": {icon:"megaphone", pal:0},

};
function thumbStyle(cat){
  cat = String(cat||"");
  var m = THUMB_BY_CAT[cat];
  if(m) return {svg: THUMB_ICON[m.icon], pal: THUMB_PALETTE[m.pal]};
  var h = 0; for(var i=0;i<cat.length;i++){ h = (h*31 + cat.charCodeAt(i)) % 100000; }
  return {svg: THUMB_ICON.doc, pal: THUMB_PALETTE[h % THUMB_PALETTE.length]};
}
function thumbHTML(n){
  if(n.image) return '<img class="thumb" src="'+esc(n.image)+'" alt="" loading="lazy">';
  var t = thumbStyle(n.cat);
  return '<div class="thumb-ph" aria-hidden="true" style="--ph-a:'+t.pal.a+';--ph-b:'+t.pal.b+';--ph-fg:'+t.pal.fg+'">'+t.svg+'</div>';
}

var PLAY_SVG = '<svg viewBox="0 0 68 68" fill="none" aria-hidden="true">'+
  '<circle cx="34" cy="34" r="33" fill="rgba(255,255,255,.94)"/>'+
  '<path d="M28 22.5 47 34 28 45.5V22.5Z" fill="#00417B"/></svg>';
function parseVideo(u){
  u = String(u||"").trim(); var m;
  m = u.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,20})/);
  if(m) return {kind:"yt", id:m[1]};
  m = u.match(/tiktok\.com\/(?:@[^\/]+\/video|v|embed\/v2)\/(\d{6,25})/);
  if(m) return {kind:"tt", id:m[1]};
  return null;
}
function videoCardHTML(v){
  var p = parseVideo(v.url); if(!p) return '';
  var thumb = (p.kind==="yt")
    ? '<img class="vd-thumb" src="https://i.ytimg.com/vi/'+esc(p.id)+'/hqdefault.jpg" alt="" loading="lazy" onerror="vdThumbFail(this)">'
    : '<div class="vd-thumb vd-tt"><span>TikTok</span></div>';
  return '<div class="video-card">'+
    '<div class="vd-frame'+(p.kind==="tt"?" vertical":"")+'" title="กดเพื่อเล่นวิดีโอ" '+
      'onclick="playVideo(this,\''+p.kind+'\',\''+esc(p.id)+'\')">'+
      thumb+'<div class="vd-play">'+PLAY_SVG+'</div>'+
    '</div>'+
    '<div class="vd-meta"><div class="vd-title">'+esc(v.title||"")+'</div>'+
      (v.note?'<div class="vd-note">'+esc(v.note)+'</div>':'')+'</div>'+
  '</div>';
}
/* ถ้าโหลดภาพปกจาก YouTube ไม่ได้ (เช่น เครือข่ายเข้าอินเทอร์เน็ตไม่ได้) ให้ใช้กล่องสีแทน ไม่ให้ขึ้นรูปแตก */
function vdThumbFail(img){
  if(!img || !img.parentNode) return;
  var d = document.createElement("div");
  d.className = "vd-thumb vd-tt vd-yt";
  d.innerHTML = '<span>YouTube</span>';
  img.parentNode.replaceChild(d, img);
}
function playVideo(el, kind, id){
  if(!/^[A-Za-z0-9_-]+$/.test(String(id))) return;
  var src = (kind==="yt")
    ? "https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1&rel=0&modestbranding=1"
    : "https://www.tiktok.com/embed/v2/"+id;
  el.innerHTML = '<iframe src="'+src+'" title="วิดีโอ" loading="lazy" '+
    'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" '+
    'referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
  el.onclick = null; el.classList.add("playing");
}

    cells += "<tr>";

      var cur = new Date(start.getFullYear(),start.getMonth(),start.getDate()+w*7+d);
      var iso = cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0")+"-"+String(cur.getDate()).padStart(2,"0");
      var evs = DATA.events.filter(function(e){ var s=e.date, en=e.end||e.date; return iso>=s && iso<=en; });

  var mo = DATA.events.filter(function(e){ return String(e.date).slice(0,7)===y+"-"+String(m+1).padStart(2,"0"); })

    '<div class="section-head"><h3>ปฏิทินกิจกรรมภาควิชา</h3></div>'+

    '</div>'+

  '</div></main>';

/* ย่อและบีบอัดรูปให้ได้ขนาดตามเป้า เพื่อประหยัดพื้นที่จัดเก็บ */
function shrinkImage(img, maxW, targetLen){
  var w=img.width, h=img.height;
  if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
  function render(ww,hh,q){
    var cv=document.createElement("canvas"); cv.width=ww; cv.height=hh;
    var cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,ww,hh);
    cx.drawImage(img,0,0,ww,hh);
    return cv.toDataURL("image/jpeg",q);
  }
  var q=0.82, url=render(w,h,q);
  while(url.length>targetLen && q>0.45){ q-=0.08; url=render(w,h,q); }
  var guard=0;
  while(url.length>targetLen && w>640 && guard<4){
    w=Math.round(w*0.78); h=Math.round(h*0.78); q=0.78; guard++;
    url=render(w,h,q);
    while(url.length>targetLen && q>0.45){ q-=0.08; url=render(w,h,q); }
  }
  return url;
}
/* ---- รูปประกอบข่าว: อัปโหลดฝังไฟล์ หรือใช้ลิงก์ก็ได้ ---- */
function isDataImg(u){ return String(u||"").indexOf("data:")===0; }
function driveImageUrl(u){
  u = String(u||"").trim();
  var m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?[^#]*[?&]?id=)([A-Za-z0-9_-]{10,})/);
  if(m) return "https://lh3.googleusercontent.com/d/"+m[1];
  return u;
}
function imgPreviewHTML(url){
  if(!url) return '<div class="hint">ยังไม่มีรูปประกอบ</div>';
  if(isDataImg(url)){
    return '<img src="'+esc(url)+'" alt="" style="max-height:140px;border-radius:8px;border:1px solid var(--line);display:block">'+
      '<div class="hint" style="margin-top:6px">รูปนี้ฝังอยู่ในไฟล์เว็บ ('+Math.round(url.length/1024)+' KB) '+
      '<button class="btn btn-danger btn-sm" onclick="view.edit.image=\'\';render()">ลบรูป</button></div>';
  }
  return '<img src="'+esc(url)+'" alt="" style="max-height:140px;border-radius:8px;border:1px solid var(--line);display:block" '+
      'onload="imgStat(1,this)" onerror="imgStat(0,this)">'+
    '<div class="hint" id="f_imgstat" style="margin-top:6px">กำลังตรวจสอบลิงก์…</div>'+
    '<div class="hint">ลิงก์ที่ใช้จริง: <code>'+esc(url)+'</code> '+
      '<button class="btn btn-danger btn-sm" onclick="view.edit.image=\'\';render()">ลบลิงก์</button></div>';
}
function imgStat(ok, im){
  var st=$("#f_imgstat"); if(!st) return;
  if(ok){ st.textContent="โหลดรูปจากลิงก์นี้ได้ปกติ ใช้ได้เลย"; st.style.color="#1B7F45"; }
  else{
    if(im) im.style.display="none";
    st.innerHTML="โหลดรูปจากลิงก์นี้ไม่ได้ — ถ้าเป็น Google Drive ให้เปิดสิทธิ์แชร์เป็น “ทุกคนที่มีลิงก์ • ผู้อ่าน” "+
      "แล้ววางลิงก์ใหม่อีกครั้ง (บางครั้ง Drive ก็ไม่ยอมให้ดึงรูปไปแสดงบนเว็บ ถ้าลองแล้วยังไม่ได้ ให้ใช้วิธีอัปโหลดฝังไฟล์แทน)";
    st.style.color="#B3261E";
  }
}
function setNewsImageUrl(v){
  v = String(v||"").trim();
  view.edit.image = v ? driveImageUrl(v) : "";
  var box = $("#f_imgbox"); if(box) box.innerHTML = imgPreviewHTML(view.edit.image);
}
function pickImage(input){
  var f=input.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ var img=new Image();
    img.onload=function(){
      view.edit.image = shrinkImage(img, 1100, 200000);
      render();
      toast("เพิ่มรูปแล้ว (ย่อเหลือประมาณ "+Math.round(view.edit.image.length/1024)+" KB)");
    };
    img.src=r.result; };
  r.readAsDataURL(f);
}
function pickAttach(input){
  var f=input.files[0]; if(!f) return;
  if(f.size > 1500000){ alert("ไฟล์ใหญ่เกิน 1.5 MB\nแนะนำให้อัปโหลดไว้บน Google Drive แล้วใส่ลิงก์แทน"); return; }
  var r=new FileReader();
  r.onload=function(){ view.edit.attachments=view.edit.attachments||[];
    view.edit.attachments.push({name:f.name,url:r.result}); render(); };
  r.readAsDataURL(f);
}

function pickLogo(input){
  var f=input.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ var img=new Image();
    img.onload=function(){ var max=256,w=img.width,h=img.height;
      if(w>max||h>max){ var k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      DATA.settings.logoUrl=cv.toDataURL("image/png"); saveData(); render(); };
    img.src=r.result; };
  r.readAsDataURL(f);
}

          'ควรกด “สร้างไฟล์เว็บฉบับใหม่” เพื่อบันทึกงานลงไฟล์ทันที จะได้ไม่เสี่ยงบันทึกไม่ได้กลางคัน<br>'+
          'การกด “ล้างการแก้ไขในเครื่องนี้” จะทำให้ตัวเลขนี้กลับเป็น 0 ก็จริง แต่พอเริ่มแก้ข้อมูลอีกครั้ง '+
          'ระบบจะเขียนข้อมูลชุดเดิมกลับลงเบราว์เซอร์ทั้งหมด ตัวเลขจึงกลับมาเท่าเดิม — '+
          '<strong>ทางแก้ที่ได้ผลจริงคือลดขนาดข้อมูล</strong> ตามคำแนะนำด้านล่าง</div>' : '')+
        '<div class="notice info" style="margin-top:14px"><strong>ถ้าพื้นที่เต็ม จะเกิดอะไรขึ้น</strong><br>'+
          'ระบบจะเตือนทันทีที่บันทึกไม่สำเร็จ และ<strong>ข้อมูลที่เพิ่งแก้จะยังอยู่บนหน้าจอ</strong> '+
          'ให้กด “สร้างไฟล์เว็บฉบับใหม่” เพื่อบันทึกลงไฟล์ก่อนปิดแท็บ งานจะไม่หาย<br>'+
          '<strong>วิธีลดขนาดถาวร</strong><br>'+
          '1) ไฟล์ PDF ขนาดใหญ่ — อัปโหลดไว้บน Google Drive ของหน่วยงาน แล้วใส่เป็น “ลิงก์ไฟล์” แทนการแนบเข้าระบบ<br>'+
          '2) รูปประกอบข่าว — ในฟอร์มข่าวมีช่อง “หรือใช้ลิงก์รูปภาพแทน” ใส่ลิงก์รูปจาก Drive หรือลิงก์รูปบนเซิร์ฟเวอร์ '+
          'รูปจะไม่ถูกฝังในไฟล์ จึงไม่กินพื้นที่เลย<br>'+
          '3) ข่าวเก่าที่ไม่ต้องใช้รูปแล้ว เข้าไปกด “ลบรูป” ในข่าวนั้น ข้อความยังอยู่ครบ</div>';
    })();
}
function download(name, content, type){
  var b=new Blob([content],{type:type||"text/plain;charset=utf-8"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}
function exportJSON(){
  download("ข้อมูลเว็บภาควิชา-"+todayISO()+".json", JSON.stringify(DATA,null,2), "application/json");
  toast("สำรองข้อมูลแล้ว");
}
function importJSON(input){
  var f=input.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ try{ var d=JSON.parse(r.result);
      if(!d.settings) throw 0;
      DATA=d; normalize(); saveData(); applyTheme(); render(); toast("กู้คืนข้อมูลเรียบร้อย");
    }catch(e){ alert("ไฟล์ไม่ถูกต้อง"); } };
  r.readAsText(f); input.value="";
}
function exportSite(){
  var json = JSON.stringify(DATA,null,2).replace(/<\//g,"<\\/");
  var out = ORIGINAL_HTML.replace(
    /(<script type="application\/json" id="site-data">)([\s\S]*?)(<\/script>)/,
    function(_,a,b,c){ return a+"\n"+json+"\n"+c; });
  if(out===ORIGINAL_HTML){ alert("ไม่สามารถสร้างไฟล์ได้ กรุณาใช้การสำรองข้อมูล .json แทน"); return; }
  download("index.html", out, "text/html;charset=utf-8");
  toast("สร้างไฟล์เว็บใหม่แล้ว — นำไปวางทับไฟล์เดิม");
}
function resetData(){
  if(!confirm("ล้างข้อมูลที่แก้ไขในเครื่องนี้ และกลับไปใช้ข้อมูลที่ฝังอยู่ในไฟล์เว็บ?\n(ข้อมูลที่ยังไม่ได้สร้างไฟล์ใหม่จะหายไป)")) return;
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  DATA=JSON.parse(JSON.stringify(EMBEDDED)); normalize(); applyTheme(); render(); toast("ล้างข้อมูลเรียบร้อย");
}

/* ---------- ลูกเล่น: เอฟเฟกต์เลื่อนหน้า ---------- */
var MOTION_KEY = null, REVEAL_IO = null;
var MOTION_SEL = ".quick-card,.news-item,.guide-item,.card,.doc-table,.article,.cal-head,table.cal,.hero-next";
function applyMotion(){
  var app = $("#app"); if(!app) return;
  var reduce = false;
  try{ reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  var key = view.name+"|"+(view.id||"")+"|"+(view.tab||"")+"|"+(view.edit?"e":"-");
  var changed = (key !== MOTION_KEY);
  MOTION_KEY = key;
  if(reduce) return;
  var els = app.querySelectorAll(MOTION_SEL), i;
  if(!changed){ for(i=0;i<els.length;i++){ els[i].classList.add("rv","rv-in"); } return; }
  app.classList.remove("page-in"); void app.offsetWidth; app.classList.add("page-in");
  if(!REVEAL_IO && window.IntersectionObserver){
    REVEAL_IO = new IntersectionObserver(function(entries){
      for(var k=0;k<entries.length;k++){
        if(entries[k].isIntersecting){ entries[k].target.classList.add("rv-in"); REVEAL_IO.unobserve(entries[k].target); }
      }
    }, {rootMargin:"0px 0px -6% 0px", threshold:0.04});
  }
  for(i=0;i<els.length;i++){
    els[i].classList.add("rv");
    els[i].style.transitionDelay = (Math.min(i,7)*45)+"ms";
    if(REVEAL_IO){ REVEAL_IO.observe(els[i]); } else { els[i].classList.add("rv-in"); }
  }
}
/* ---------- render ---------- */
function render(){
  applyTheme();
  var body;
  switch(view.name){
    case "news": body=pageNews(); break;
    case "orders": body=pageOrders(); break;
    case "guide": body=pageGuide(); break;
    case "article": body=pageArticle(); break;
    case "calendar": body=pageCalendar(); break;
    case "docs": body=pageDocs(); break;
    case "contact": body=pageContact(); break;
    case "admin": body=pageAdmin(); break;
    default: body=pageHome();
  }
  $("#app").innerHTML = headerHTML() + body + footerHTML();
  applyMotion();
}

loadData();
readHash();
render();
